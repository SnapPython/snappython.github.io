        importFile: document.querySelector("#importFile"),
        nextBlockTime: document.querySelector("#nextBlockTime"),
        nextBlockTitle: document.querySelector("#nextBlockTitle"),
        nextDay: document.querySelector("#nextDay"),
        notesCount: document.querySelector("#notesCount"),
        plannerDate: document.querySelector("#plannerDate"),
        previousDay: document.querySelector("#previousDay"),
        priorityCount: document.querySelector("#priorityCount"),
        priorityList: document.querySelector("#priorityList"),
        saveState: document.querySelector("#saveState"),
        scheduleCount: document.querySelector("#scheduleCount"),
        taskCategory: document.querySelector("#taskCategory"),
        taskForm: document.querySelector("#taskForm"),
        taskList: document.querySelector("#taskList"),
        taskText: document.querySelector("#taskText"),
        themeIcon: document.querySelector("#themeIcon"),
        themeToggle: document.querySelector("#themeToggle"),
        timelineCanvas: document.querySelector("#timelineCanvas"),
        timelineEvents: document.querySelector("#timelineEvents"),
        timelineGrid: document.querySelector("#timelineGrid"),
        timelineScroll: document.querySelector("#timelineScroll"),
        todayButton: document.querySelector("#todayButton"),
        weekGoal: document.querySelector("#weekGoal"),
        weekMilestone: document.querySelector("#weekMilestone"),
        weekProgress: document.querySelector("#weekProgress"),
        weekProgressValue: document.querySelector("#weekProgressValue"),
        weekRange: document.querySelector("#weekRange"),
      };

      let selectedDateKey = toDateKey(new Date());
      let taskFilter = "open";
      let editingBlockId = null;
      let state = loadState();

      function createId() {
        if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
          return globalThis.crypto.randomUUID();
        }
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function cleanText(value, limit) {
        return String(value ?? "").slice(0, limit);
      }

      function validCategory(value) {
        return Object.hasOwn(CATEGORY_LABELS, value) ? value : "life";
      }

      function timeToMinutes(value) {
        if (!/^\d{2}:\d{2}$/.test(value || "")) return 0;
        const [hour, minute] = value.split(":").map(Number);
        return Math.min(1439, Math.max(0, hour * 60 + minute));
      }

      function minutesToTime(value) {
        const minutes = Math.min(1439, Math.max(0, Math.round(value)));
        const hour = Math.floor(minutes / 60);
        const minute = minutes % 60;
        return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
      }

      function normalizeBlockRange(startValue, endValue) {
        const fallbackStart = /^\d{2}:\d{2}$/.test(startValue || "")
          ? startValue
          : "09:00";
        const startMinutes = Math.min(1410, timeToMinutes(fallbackStart));
        const requestedEnd = /^\d{2}:\d{2}$/.test(endValue || "")
          ? timeToMinutes(endValue)
          : startMinutes + 60;
        const endMinutes = Math.min(
          1439,
          Math.max(startMinutes + 30, requestedEnd),
        );
        return {
          start: minutesToTime(startMinutes),
          end: minutesToTime(endMinutes),
        };
      }

      function readBlockRange(startInput, endInput) {
        const startMinutes = timeToMinutes(startInput.value);
        const endMinutes = timeToMinutes(endInput.value);
        const minimumDuration = startMinutes === 1410 ? 29 : 30;
        if (endMinutes - startMinutes < minimumDuration) {
          endInput.setCustomValidity("结束时间需要晚于开始时间至少 30 分钟");
          endInput.reportValidity();
          return null;
        }
        endInput.setCustomValidity("");
        return {
          start: minutesToTime(startMinutes),
          end: minutesToTime(endMinutes),
        };
      }

      function keepEndAfterStart(startInput, endInput) {
        const startMinutes = timeToMinutes(startInput.value);
        const endMinutes = timeToMinutes(endInput.value);
        const minimumEnd = Math.min(1439, startMinutes + 60);
        if (endMinutes <= startMinutes || endMinutes - startMinutes < 30) {
          endInput.value = minutesToTime(minimumEnd);
        }
        endInput.setCustomValidity("");
      }

      function makeDay() {
        return {
          priorities: Array.from({ length: 3 }, () => ({
            text: "",
            done: false,
          })),
          blocks: [],
          tasks: [],
          notes: "",
        };
      }

      function normalizeDay(rawDay) {
        const source = rawDay && typeof rawDay === "object" ? rawDay : {};
        const rawPriorities = Array.isArray(source.priorities)
          ? source.priorities
          : [];
        const priorities = Array.from({ length: 3 }, (_, index) => {
          const item = rawPriorities[index] || {};
          return {
            text: cleanText(item.text, 240),
            done: Boolean(item.done),
          };
        });
        const blocks = Array.isArray(source.blocks)
          ? source.blocks.slice(0, 200).map((item) => {
              const range = normalizeBlockRange(
                item.start || item.time,
                item.end,
              );
              return {
                id: cleanText(item.id || createId(), 120),
                start: range.start,
                end: range.end,
                category: validCategory(item.category),
                text: cleanText(item.text, 240),
                done: Boolean(item.done),
              };
            }).filter((item) => item.text.trim())
          : [];
        const tasks = Array.isArray(source.tasks)
          ? source.tasks.slice(0, 300).map((item) => ({
              id: cleanText(item.id || createId(), 120),
              category: validCategory(item.category),
              text: cleanText(item.text, 240),
              done: Boolean(item.done),
            })).filter((item) => item.text.trim())
          : [];

        return {
          priorities,
          blocks,
          tasks,
          notes: cleanText(source.notes, 10000),
        };
      }

      function normalizeWeek(rawWeek) {
        const source = rawWeek && typeof rawWeek === "object" ? rawWeek : {};
        return {
          goal: cleanText(source.goal, 800),
          milestone: cleanText(source.milestone, 240),
          progress: Math.min(100, Math.max(0, Number(source.progress) || 0)),
        };
      }

      function normalizeState(rawState) {
        const normalized = {
          version: STATE_VERSION,
          days: {},
          weeks: {},
        };

        if (!rawState || typeof rawState !== "object") return normalized;

        if (rawState.days && typeof rawState.days === "object") {
          Object.entries(rawState.days).forEach(([key, value]) => {
            if (/^\d{4}-\d{2}-\d{2}$/.test(key)) {
              normalized.days[key] = normalizeDay(value);
            }
          });
        }

        if (rawState.weeks && typeof rawState.weeks === "object") {
          Object.entries(rawState.weeks).forEach(([key, value]) => {
            if (/^\d{4}-W\d{2}$/.test(key)) {
              normalized.weeks[key] = normalizeWeek(value);
            }
          });
        }

        return normalized;
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? normalizeState(JSON.parse(raw)) : normalizeState({});
        } catch {
          return normalizeState({});
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          const savedAt = new Intl.DateTimeFormat("zh-CN", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          }).format(new Date());
          elements.saveState.textContent = `已保存 ${savedAt}`;
        } catch {
          elements.saveState.textContent = "保存失败，请导出备份";
        }
      }

      function ensureDay() {
        if (!state.days[selectedDateKey]) {
          state.days[selectedDateKey] = makeDay();
        }
        return state.days[selectedDateKey];
      }

      function ensureWeek() {
        const key = getWeekKey(fromDateKey(selectedDateKey));
        if (!state.weeks[key]) {
          state.weeks[key] = normalizeWeek({});
        }
        return state.weeks[key];
      }

      function toDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function fromDateKey(key) {
        const [year, month, day] = key.split("-").map(Number);
        return new Date(year, month - 1, day, 12);
      }

      function shiftDate(key, amount) {
        const date = fromDateKey(key);
        date.setDate(date.getDate() + amount);
        return toDateKey(date);
      }

      function getWeekKey(date) {
        const utcDate = new Date(
          Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()),
        );
        const day = utcDate.getUTCDay() || 7;
        utcDate.setUTCDate(utcDate.getUTCDate() + 4 - day);
        const yearStart = new Date(Date.UTC(utcDate.getUTCFullYear(), 0, 1));
        const week = Math.ceil(((utcDate - yearStart) / 86400000 + 1) / 7);
        return `${utcDate.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
      }

      function getWeekRange(date) {
        const monday = new Date(date);
        const day = monday.getDay() || 7;
        monday.setDate(monday.getDate() - day + 1);
        const sunday = new Date(monday);
        sunday.setDate(sunday.getDate() + 6);
        const format = new Intl.DateTimeFormat("zh-CN", {
          month: "numeric",
          day: "numeric",
        });
        return `${format.format(monday)} - ${format.format(sunday)}`;
      }

      function escapeHTML(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function categoryOptions(selected) {
        return Object.entries(CATEGORY_LABELS)
          .map(
            ([value, label]) =>
              `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`,
          )
          .join("");
      }

      function renderDateContext() {
        const date = fromDateKey(selectedDateKey);
        const todayKey = toDateKey(new Date());
        const difference = Math.round((date - fromDateKey(todayKey)) / 86400000);
        const relation =
          difference === 0
            ? "今天"
            : difference === 1
              ? "明天"
              : difference === -1
                ? "昨天"
                : difference > 1
                  ? "未来计划"
                  : "往日回顾";

        elements.plannerDate.value = selectedDateKey;
        elements.fullDate.textContent = `${relation} · ${new Intl.DateTimeFormat(
          "zh-CN",
          {
            year: "numeric",
            month: "long",
            day: "numeric",
            weekday: "long",
          },
        ).format(date)}`;

        if (difference === 0) {
          elements.dayPrompt.textContent = "先完成最重要的一件事。";
        } else if (difference === 1) {
          elements.dayPrompt.textContent = "为明天留出清晰的开始。";
        } else if (difference > 1) {
          elements.dayPrompt.textContent = "提前安排，把精力留给重要的事。";
        } else {
          elements.dayPrompt.textContent = "回看这一天的推进与节奏。";
        }
      }

      function renderPriorities() {
        const day = ensureDay();
        elements.priorityList.innerHTML = day.priorities
          .map(
            (item, index) => `
              <label class="priority-row">
                <input
                  class="priority-check"
                  type="checkbox"
                  data-priority-index="${index}"
                  ${item.done ? "checked" : ""}
                  aria-label="完成第 ${index + 1} 件事"
                />
                <span class="priority-index">${String(index + 1).padStart(2, "0")}</span>
                <input
                  class="priority-input"
                  type="text"
                  data-priority-index="${index}"
                  maxlength="240"
                  value="${escapeHTML(item.text)}"
                  placeholder="${priorityPlaceholders[index]}"
                  aria-label="第 ${index + 1} 件重要事项"
                />
              </label>
            `,
          )
          .join("");
      }

      function renderWeek() {
        const date = fromDateKey(selectedDateKey);
        const week = ensureWeek();
        elements.weekRange.textContent = getWeekRange(date);
        elements.weekGoal.value = week.goal;
        elements.weekMilestone.value = week.milestone;
        elements.weekProgress.value = week.progress;
        elements.weekProgressValue.value = `${week.progress}%`;
        elements.weekProgressValue.textContent = `${week.progress}%`;
      }

      function renderTimelineGrid() {
        elements.timelineGrid.innerHTML = Array.from({ length: 24 }, (_, hour) => {
          const hourTop = (hour / 24) * 100;
          const halfHourTop = ((hour + 0.5) / 24) * 100;
          return `
            <div class="timeline-hour" style="top: ${hourTop}%">
              <span class="timeline-hour-label">${String(hour).padStart(2, "0")}:00</span>
            </div>
            <div class="timeline-half-hour" style="top: ${halfHourTop}%"></div>
          `;
        }).join("");
      }

      function layoutTimelineBlocks(blocks) {
        const entries = blocks
          .map((item) => ({
            item,
            startMinutes: timeToMinutes(item.start),
            endMinutes: timeToMinutes(item.end),
          }))
          .sort(
            (a, b) =>
              a.startMinutes - b.startMinutes ||
              a.endMinutes - b.endMinutes,
          );
        const groups = [];
        let currentGroup = [];
        let groupEnd = -1;

        entries.forEach((entry) => {
          if (currentGroup.length && entry.startMinutes >= groupEnd) {
            groups.push(currentGroup);
            currentGroup = [];
            groupEnd = -1;
          }
          currentGroup.push(entry);
          groupEnd = Math.max(groupEnd, entry.endMinutes);
        });
        if (currentGroup.length) groups.push(currentGroup);

        return groups.flatMap((group) => {
          const laneEnds = [];
          group.forEach((entry) => {
            let lane = laneEnds.findIndex((end) => end <= entry.startMinutes);
            if (lane === -1) lane = laneEnds.length;
            laneEnds[lane] = entry.endMinutes;
            entry.lane = lane;
          });
          const laneCount = Math.max(1, laneEnds.length);
          return group.map((entry) => ({ ...entry, laneCount }));
        });
      }

      function renderBlocks() {
        const day = ensureDay();
        const blocks = [...day.blocks].sort((a, b) =>
          a.start.localeCompare(b.start),
        );
        const positionedBlocks = layoutTimelineBlocks(blocks);
        elements.scheduleCount.textContent = `${blocks.length} 个时间块`;

        if (!positionedBlocks.length) {
          elements.timelineEvents.innerHTML =
            '<div class="timeline-empty">这一天还没有时间块</div>';
          updateCurrentTimeLine();
          return;
        }

        elements.timelineEvents.innerHTML = positionedBlocks
          .map(({ item, startMinutes, endMinutes, lane, laneCount }) => {
            const top = (startMinutes / 1440) * 100;
            const height = ((endMinutes - startMinutes) / 1440) * 100;
            const laneWidth = 100 / laneCount;
            const left = lane * laneWidth;
            const duration = endMinutes - startMinutes;
            return `
              <button
                class="time-block"
                type="button"
                data-item-id="${escapeHTML(item.id)}"
                data-category="${item.category}"
                data-done="${item.done}"
                data-compact="${duration < 45}"
                style="
                  top: ${top}%;
                  height: ${height}%;
                  left: calc(${left}% + 3px);
                  width: calc(${laneWidth}% - 6px);
                "
                aria-label="${escapeHTML(
                  `${item.start} 至 ${item.end}，${item.text}，${
                    CATEGORY_LABELS[item.category]
                  }`,
                )}"
              >
                <span class="time-block-title">${escapeHTML(item.text)}</span>
                <span class="time-block-meta">
                  ${item.start} - ${item.end} · ${CATEGORY_LABELS[item.category]}
                </span>
              </button>
            `;
          })
          .join("");
        updateCurrentTimeLine();
      }

      function updateCurrentTimeLine() {
        const now = new Date();
        if (selectedDateKey !== toDateKey(now)) {
          elements.currentTimeLine.hidden = true;
          return;
        }
        const minutes = now.getHours() * 60 + now.getMinutes();
        elements.currentTimeLine.hidden = false;
        elements.currentTimeLine.style.top = `${(minutes / 1440) * 100}%`;
        elements.currentTimeLabel.textContent = minutesToTime(minutes);
      }

      function scrollTimelineToFocus() {
        window.requestAnimationFrame(() => {
          const day = ensureDay();
          const now = new Date();
          const firstBlock = [...day.blocks].sort((a, b) =>
            a.start.localeCompare(b.start),
          )[0];
          const focusMinutes =
            selectedDateKey === toDateKey(now)
              ? now.getHours() * 60 + now.getMinutes()
              : firstBlock
                ? timeToMinutes(firstBlock.start)
                : 8 * 60;
          const target =
            (focusMinutes / 1440) * elements.timelineCanvas.offsetHeight -
            elements.timelineScroll.clientHeight * 0.2;
          elements.timelineScroll.scrollTop = Math.max(0, target);
        });
      }

      function openBlockDialog(id) {
        const block = ensureDay().blocks.find((item) => item.id === id);
        if (!block) return;
        editingBlockId = id;
        elements.editBlockText.value = block.text;
        elements.editBlockStart.value = block.start;
        elements.editBlockEnd.value = block.end;
        elements.editBlockCategory.value = block.category;
        elements.editBlockDone.checked = block.done;
        elements.blockDialog.showModal();
        elements.editBlockText.focus();
      }

      function renderTasks() {
        const day = ensureDay();
        const tasks = day.tasks.filter((item) => {
          if (taskFilter === "open") return !item.done;
          if (taskFilter === "done") return item.done;
          return true;
        });

        document.querySelectorAll("[data-task-filter]").forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.taskFilter === taskFilter),
          );
        });

        if (!tasks.length) {
          const message =
            taskFilter === "done"
              ? "还没有已完成的待办"
              : taskFilter === "open"
                ? "当前没有待办"
                : "这一天还没有待办";
          elements.taskList.innerHTML = `<div class="empty-state">${message}</div>`;
          return;
        }

        elements.taskList.innerHTML = tasks
          .map(
            (item) => `
              <div class="list-row task-row" data-item-id="${escapeHTML(item.id)}">
                <input
                  class="item-check"
                  type="checkbox"
                  ${item.done ? "checked" : ""}
                  aria-label="标记待办为完成"
                />
                <select class="row-category" aria-label="待办类别">
                  ${categoryOptions(item.category)}
                </select>
                <input
                  class="row-text"
                  type="text"
                  maxlength="240"
                  value="${escapeHTML(item.text)}"
                  aria-label="待办内容"
                />
                <button
                  class="delete-button"
                  type="button"
                  data-action="delete-task"
                  aria-label="删除待办"
                  title="删除"
                >
                  <span aria-hidden="true">×</span>
                </button>
              </div>
            `,
          )
          .join("");
      }

      function renderNotes() {
        const day = ensureDay();
        elements.dailyNotes.value = day.notes;
        elements.notesCount.textContent = `${day.notes.length} 字`;
      }

      function refreshSummary() {
        const day = ensureDay();
        const activePriorities = day.priorities.filter((item) => item.text.trim());
        const allItems = [...activePriorities, ...day.blocks, ...day.tasks];
        const completed = allItems.filter((item) => item.done).length;
        const total = allItems.length;
        const percentage = total ? Math.round((completed / total) * 100) : 0;

        elements.completionValue.textContent = `${completed} / ${total}`;
        elements.completionBar.style.width = `${percentage}%`;
        elements.priorityCount.textContent =
          `${activePriorities.length} / 3 已安排`;
        elements.notesCount.textContent = `${day.notes.length} 字`;

        const sortedBlocks = [...day.blocks]
          .filter((item) => !item.done)
          .sort((a, b) => a.start.localeCompare(b.start));
        let nextBlock = sortedBlocks[0];

        if (selectedDateKey === toDateKey(new Date())) {
          const now = new Date();
          const currentTime = `${String(now.getHours()).padStart(2, "0")}:${String(
            now.getMinutes(),
          ).padStart(2, "0")}`;
          nextBlock = sortedBlocks.find((item) => item.end > currentTime);
        }

        if (nextBlock) {
          elements.nextBlockTitle.textContent = nextBlock.text;
          elements.nextBlockTime.textContent =
            `${nextBlock.start} - ${nextBlock.end} · ${
              CATEGORY_LABELS[nextBlock.category]
            }`;
        } else {
          elements.nextBlockTitle.textContent = "暂无安排";
          elements.nextBlockTime.textContent = "留给自由推进";
        }
      }

      function suggestBlockRange() {
        if (selectedDateKey !== toDateKey(new Date())) {
          return { start: "09:00", end: "10:00" };
        }
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const nextSlot = Math.min(23 * 60 + 30, Math.ceil((currentMinutes + 1) / 30) * 30);
        return normalizeBlockRange(
          minutesToTime(nextSlot),
          minutesToTime(nextSlot + 60),
        );
      }

      function renderSelectedDay() {
        ensureDay();
        renderDateContext();
        renderPriorities();
        renderWeek();
        renderBlocks();
        renderTasks();
        renderNotes();
        refreshSummary();
        const suggestedRange = suggestBlockRange();
        elements.blockStart.value = suggestedRange.start;
        elements.blockEnd.value = suggestedRange.end;
        scrollTimelineToFocus();
      }

      function setSelectedDate(key) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
        selectedDateKey = key;
        renderSelectedDay();
      }

      function findItem(list, eventTarget) {
        const row = eventTarget.closest("[data-item-id]");
        if (!row) return null;
        return list.find((item) => item.id === row.dataset.itemId) || null;
      }

      function updateClock() {
        const now = new Date();
        const hour = now.getHours();
        elements.clock.textContent = new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(now);

        if (hour < 5) {
          elements.greeting.textContent = "夜深了";
        } else if (hour < 11) {
          elements.greeting.textContent = "早上好";
        } else if (hour < 14) {
          elements.greeting.textContent = "中午好";
        } else if (hour < 18) {
          elements.greeting.textContent = "下午好";
        } else if (hour < 23) {
          elements.greeting.textContent = "晚上好";
        } else {
          elements.greeting.textContent = "今天辛苦了";
        }

        elements.currentYear.textContent = now.getFullYear();
        refreshSummary();
        updateCurrentTimeLine();
      }

      function applyThemeIcon() {
        const isDark = document.documentElement.dataset.theme === "dark";
        elements.themeIcon.textContent = isDark ? "☀" : "☾";
        elements.themeToggle.setAttribute(
          "aria-label",
          isDark ? "切换到浅色模式" : "切换到深色模式",
        );
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", isDark ? "#080a0c" : "#17191c");
      }

      function renderApps() {
        elements.appGrid.innerHTML = APPS.map(
          (app) => `
            <article class="app-card" style="--app-accent: ${app.accent}">
              <div class="app-top">
                <span class="app-mark" aria-hidden="true">${app.mark}</span>
                <span
                  class="health"
                  id="health-${app.id}"
                  data-health="${app.access === "sso" ? "sso" : "checking"}"
                  aria-label="${
                    app.access === "sso"
                      ? `${app.name} 需要统一登录`
                      : `${app.name} 状态检测中`
                  }"
                >
                  <span class="health-dot" aria-hidden="true"></span>
                  <span class="health-label">${
                    app.access === "sso" ? "SSO" : "检测中"
                  }</span>
                </span>
              </div>
              <p class="app-domain">${app.domain}</p>
              <h3 class="app-name">${app.name}</h3>
              <div class="app-actions">
                <a
                  class="open-app"
                  href="${app.url}"
                  target="_blank"
                  rel="noopener"
                >
                  打开
                  <span aria-hidden="true">↗</span>
                </a>
                <a
                  class="repo-link"
                  href="${app.repoUrl}"
                  target="_blank"
                  rel="noopener"
                  aria-label="查看 ${app.name} 的代码仓库"
                  title="代码仓库"
                >
                  <span aria-hidden="true">⌘</span>
                </a>
              </div>
            </article>
          `,
        ).join("");

        document.querySelector("#systemCount").textContent =
          `${APPS.length} 个入口 · ${APPS.filter((app) => app.access === "sso").length} 个 SSO`;
      }

      async function checkApp(app) {
        if (app.access === "sso") return;
        const status = document.querySelector(`#health-${app.id}`);
        const label = status.querySelector(".health-label");
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 8000);

        try {
          const response = await fetch(app.url, {
            method: "HEAD",
            cache: "no-store",
            signal: controller.signal,
          });
          status.dataset.health = response.ok ? "online" : "offline";
          label.textContent = response.ok ? "在线" : "不可用";
          status.setAttribute(
            "aria-label",
            `${app.name} ${response.ok ? "在线" : "暂时不可用"}`,
          );
        } catch {
          status.dataset.health = "offline";
          label.textContent = "未连接";
          status.setAttribute("aria-label", `${app.name} 状态未确认`);
        } finally {
          window.clearTimeout(timeout);
        }
      }

      function escapeCalendarText(value) {
        return String(value)
          .replaceAll("\\", "\\\\")
          .replaceAll("\n", "\\n")
          .replaceAll(",", "\\,")
          .replaceAll(";", "\\;");
      }

      function exportDayCalendar() {
        const blocks = [...ensureDay().blocks].sort((a, b) =>
          a.start.localeCompare(b.start),
        );
        if (!blocks.length) {
          window.alert("这一天还没有可以导出的时间块。");
          return;
        }

        const dateStamp = selectedDateKey.replaceAll("-", "");
        const generatedAt = new Date()
          .toISOString()
          .replaceAll("-", "")
          .replaceAll(":", "")
          .replace(/\.\d{3}Z$/, "Z");
        const events = blocks.flatMap((item) => [
          "BEGIN:VEVENT",
          `UID:${escapeCalendarText(item.id)}@snappython.github.io`,
          `DTSTAMP:${generatedAt}`,
          `DTSTART:${dateStamp}T${item.start.replace(":", "")}00`,
          `DTEND:${dateStamp}T${item.end.replace(":", "")}00`,
          `SUMMARY:${escapeCalendarText(item.text)}`,
          `CATEGORIES:${escapeCalendarText(CATEGORY_LABELS[item.category])}`,
          `X-SNAP-DONE:${item.done ? "TRUE" : "FALSE"}`,
          "END:VEVENT",
        ]);
        const calendar = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//SnapPython//Graduate Life Cockpit//ZH-CN",
          "CALSCALE:GREGORIAN",
          "METHOD:PUBLISH",
          `X-WR-CALNAME:${selectedDateKey} 生活驾驶舱`,
          ...events,
          "END:VCALENDAR",
          "",
        ].join("\r\n");
        const blob = new Blob([calendar], {
          type: "text/calendar;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `schedule-${selectedDateKey}.ics`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function exportBackup() {
        const payload = {
          ...state,
          exportedAt: new Date().toISOString(),
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `life-cockpit-backup-${toDateKey(new Date())}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      async function importBackup(file) {
        try {
          const parsed = JSON.parse(await file.text());
          if (!parsed || typeof parsed.days !== "object") {
            throw new Error("Invalid backup");
          }
          const shouldRestore = window.confirm(
            "导入备份会替换当前设备上的驾驶舱数据，是否继续？",
          );
          if (!shouldRestore) return;
          state = normalizeState(parsed);
          saveState();
          renderSelectedDay();
          window.alert("备份已恢复。");
        } catch {
          window.alert("无法读取这个备份文件。");
        } finally {
          elements.importFile.value = "";
        }
      }

      elements.themeToggle.addEventListener("click", () => {
        const nextTheme =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        try {
          localStorage.setItem("life-cockpit-theme", nextTheme);
        } catch {
          // The selected theme still applies for the current page.
        }
        applyThemeIcon();
      });

      elements.previousDay.addEventListener("click", () => {
        setSelectedDate(shiftDate(selectedDateKey, -1));
      });

      elements.nextDay.addEventListener("click", () => {
        setSelectedDate(shiftDate(selectedDateKey, 1));
      });

      elements.todayButton.addEventListener("click", () => {
        setSelectedDate(toDateKey(new Date()));
      });

      elements.plannerDate.addEventListener("change", (event) => {
        setSelectedDate(event.target.value);
      });

      elements.priorityList.addEventListener("input", (event) => {
        if (!event.target.classList.contains("priority-input")) return;
        const index = Number(event.target.dataset.priorityIndex);
        ensureDay().priorities[index].text = event.target.value;
        saveState();
        refreshSummary();
      });

      elements.priorityList.addEventListener("change", (event) => {
        if (!event.target.classList.contains("priority-check")) return;
        const index = Number(event.target.dataset.priorityIndex);
        ensureDay().priorities[index].done = event.target.checked;
        saveState();
        refreshSummary();
      });

      elements.weekGoal.addEventListener("input", (event) => {
        ensureWeek().goal = event.target.value;
        saveState();
      });

      elements.weekMilestone.addEventListener("input", (event) => {
        ensureWeek().milestone = event.target.value;
        saveState();
      });

      elements.weekProgress.addEventListener("input", (event) => {
        const value = Number(event.target.value);
        ensureWeek().progress = value;
        elements.weekProgressValue.value = `${value}%`;
        elements.weekProgressValue.textContent = `${value}%`;
        saveState();
      });

      elements.blockForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = elements.blockText.value.trim();
        const range = readBlockRange(elements.blockStart, elements.blockEnd);
        if (!text || !range) return;
        ensureDay().blocks.push({
          id: createId(),
          start: range.start,
          end: range.end,
          category: validCategory(elements.blockCategory.value),
          text,
          done: false,
        });
        elements.blockText.value = "";
        saveState();
        renderBlocks();
        refreshSummary();
        elements.blockText.focus();
      });

      elements.blockStart.addEventListener("change", () => {
        keepEndAfterStart(elements.blockStart, elements.blockEnd);
      });

      elements.blockEnd.addEventListener("input", () => {
        elements.blockEnd.setCustomValidity("");
      });

      elements.timelineEvents.addEventListener("click", (event) => {
        const block = event.target.closest(".time-block");
        if (block) openBlockDialog(block.dataset.itemId);
      });

      elements.timelineCanvas.addEventListener("click", (event) => {
        if (event.target.closest(".time-block")) return;
        const bounds = elements.timelineCanvas.getBoundingClientRect();
        const clickedMinutes = Math.round(
          ((event.clientY - bounds.top) / bounds.height) * 1440,
        );
        const startMinutes = Math.min(
          1410,
          Math.max(0, Math.round(clickedMinutes / 30) * 30),
        );
        const range = normalizeBlockRange(
          minutesToTime(startMinutes),
          minutesToTime(startMinutes + 60),
        );
        elements.blockStart.value = range.start;
        elements.blockEnd.value = range.end;
        elements.blockText.focus();
      });

      elements.editBlockStart.addEventListener("change", () => {
        keepEndAfterStart(elements.editBlockStart, elements.editBlockEnd);
      });

      elements.editBlockEnd.addEventListener("input", () => {
        elements.editBlockEnd.setCustomValidity("");
      });

      elements.blockEditForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const block = ensureDay().blocks.find(
          (item) => item.id === editingBlockId,
        );
        const range = readBlockRange(
          elements.editBlockStart,
          elements.editBlockEnd,
        );
        const text = elements.editBlockText.value.trim();
        if (!block || !range || !text) return;
        block.text = text;
        block.start = range.start;
        block.end = range.end;
        block.category = validCategory(elements.editBlockCategory.value);
        block.done = elements.editBlockDone.checked;
        saveState();
        renderBlocks();
        refreshSummary();
        elements.blockDialog.close();
        editingBlockId = null;
      });

      elements.deleteBlockButton.addEventListener("click", () => {
        if (!editingBlockId) return;
        ensureDay().blocks = ensureDay().blocks.filter(
          (item) => item.id !== editingBlockId,
        );
        saveState();
        renderBlocks();
        refreshSummary();
        elements.blockDialog.close();
        editingBlockId = null;
      });

      elements.closeBlockDialog.addEventListener("click", () => {
        elements.blockDialog.close();
        editingBlockId = null;
      });

      elements.cancelBlockEdit.addEventListener("click", () => {
        elements.blockDialog.close();
        editingBlockId = null;
      });

      elements.blockDialog.addEventListener("click", (event) => {
        if (event.target === elements.blockDialog) {
          elements.blockDialog.close();
          editingBlockId = null;
        }
      });

      elements.taskForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = elements.taskText.value.trim();
        if (!text) return;
        ensureDay().tasks.push({
          id: createId(),
          category: validCategory(elements.taskCategory.value),
          text,
          done: false,
        });
        elements.taskText.value = "";
        taskFilter = "open";
        saveState();
        renderTasks();
        refreshSummary();
        elements.taskText.focus();
      });

      elements.taskList.addEventListener("input", (event) => {
        if (!event.target.classList.contains("row-text")) return;
        const item = findItem(ensureDay().tasks, event.target);
        if (!item) return;
        item.text = event.target.value;
        saveState();
        refreshSummary();
      });

      elements.taskList.addEventListener("change", (event) => {
        const item = findItem(ensureDay().tasks, event.target);
        if (!item) return;
        if (event.target.classList.contains("item-check")) {
          item.done = event.target.checked;
        } else if (event.target.classList.contains("row-category")) {
          item.category = validCategory(event.target.value);
        } else {
          return;
        }
        saveState();
        renderTasks();
        refreshSummary();
      });

      elements.taskList.addEventListener("click", (event) => {
        const button = event.target.closest('[data-action="delete-task"]');
        if (!button) return;
        const row = button.closest("[data-item-id]");
        ensureDay().tasks = ensureDay().tasks.filter(
          (item) => item.id !== row.dataset.itemId,
        );
        saveState();
        renderTasks();
        refreshSummary();
      });

      document.querySelectorAll("[data-task-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          taskFilter = button.dataset.taskFilter;
          renderTasks();
        });
      });

      elements.dailyNotes.addEventListener("input", (event) => {
        ensureDay().notes = event.target.value;
        saveState();
        elements.notesCount.textContent = `${event.target.value.length} 字`;
      });

      elements.exportButton.addEventListener("click", exportBackup);
      elements.exportCalendarButton.addEventListener("click", exportDayCalendar);
      elements.importButton.addEventListener("click", () => {
        elements.importFile.click();
      });
      elements.importFile.addEventListener("change", (event) => {
        const [file] = event.target.files;
        if (file) importBackup(file);
      });

      window.addEventListener("storage", (event) => {
        if (event.key !== STORAGE_KEY || !event.newValue) return;
        try {
          state = normalizeState(JSON.parse(event.newValue));
          renderSelectedDay();
          elements.saveState.textContent = "已从其他页面同步";
        } catch {
          // Ignore incomplete writes from another tab.
        }
      });

      renderApps();
      renderTimelineGrid();
      renderSelectedDay();
      updateClock();
      applyThemeIcon();
      APPS.forEach(checkApp);
      window.setInterval(updateClock, 30000);
    </script>
  </body>
</html>
