<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>正在打开生活驾驶舱 | SnapPython</title>
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate"
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #18212a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 460px);
        text-align: center;
      }

      .mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border-radius: 8px;
        background: #1e6f5c;
        color: #fff;
        font-size: 20px;
        font-weight: 750;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 7vw, 34px);
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        min-height: 24px;
        margin: 12px 0 24px;
        color: #5b6670;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      a,
      button {
        min-height: 44px;
        border: 1px solid #ccd3d8;
        border-radius: 6px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #18212a;
        font: inherit;
        font-weight: 650;
        letter-spacing: 0;
        text-decoration: none;
        cursor: pointer;
      }

      .primary {
        border-color: #1e6f5c;
        background: #1e6f5c;
        color: #fff;
      }

      [hidden] {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          background: #15191d;
          color: #edf1f3;
        }

        p {
          color: #aeb8bf;
        }

        a,
        button {
          border-color: #3b454c;
          background: #22282d;
          color: #edf1f3;
        }

        .primary {
          border-color: #4ca68e;
          background: #277a65;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">LC</div>
      <h1>生活驾驶舱</h1>
      <p id="status">正在打开，并迁移这台设备上的旧数据…</p>
      <div class="actions">
        <a class="primary" id="openCockpit" href="#">立即打开</a>
        <button id="downloadBackup" type="button" hidden>下载旧数据</button>
      </div>
    </main>

    <script>
      const STORAGE_KEY = "graduate-life-cockpit-v1";
      const TARGET = "https://life.72-11-130-223.sslip.io:8444/";
      const MAX_FRAGMENT_LENGTH = 1500000;
      const status = document.querySelector("#status");
      const openCockpit = document.querySelector("#openCockpit");
      const downloadBackup = document.querySelector("#downloadBackup");

      function hasData(raw) {
        try {
          const parsed = JSON.parse(raw);
          return (
            Object.keys(parsed.days || {}).length > 0 ||
            Object.keys(parsed.weeks || {}).length > 0
          );
        } catch {
          return false;
        }
      }

      function encodeState(raw) {
        const bytes = new TextEncoder().encode(raw);
        let binary = "";
        for (let offset = 0; offset < bytes.length; offset += 32768) {
          binary += String.fromCharCode(
            ...bytes.subarray(offset, offset + 32768),
          );
        }
        return window
          .btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
      }

      function offerBackup(raw) {
        status.textContent = "旧数据较多，请先下载备份，再从新页面导入。";
        openCockpit.href = TARGET;
        downloadBackup.hidden = false;
        downloadBackup.addEventListener("click", () => {
          const blob = new Blob([raw], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "life-cockpit-github-pages-backup.json";
          link.click();
          URL.revokeObjectURL(url);
        });
      }

      function start() {
        const raw = localStorage.getItem(STORAGE_KEY);
        let destination = TARGET;
        if (raw && hasData(raw)) {
          const encoded = encodeState(raw);
          if (encoded.length > MAX_FRAGMENT_LENGTH) {
            offerBackup(raw);
            return;
          }
          destination = `${TARGET}#migrate=${encoded}`;
        }
        openCockpit.href = destination;
        window.setTimeout(() => window.location.replace(destination), 700);
      }

      try {
        start();
      } catch {
        status.textContent = "旧数据仍保留在这台设备上。";
        openCockpit.href = TARGET;
      }
    </script>
    <noscript>
      <p>
        <a href="https://life.72-11-130-223.sslip.io:8444/">
          打开生活驾驶舱
        </a>
      </p>
    </noscript>
  </body>
</html>
