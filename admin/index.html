<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17191c" />
    <title>研究生生活驾驶舱 | SnapPython</title>
    <meta
      name="description"
      content="用于安排研究、课程与生活的个人日程工作台。"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("life-cockpit-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          savedTheme || (prefersDark ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --page: #f3f5f6;
        --surface: #ffffff;
        --surface-soft: #eef1f2;
        --surface-raised: #f9fafb;
        --band: #17191c;
        --band-soft: #24272c;
        --text: #202327;
        --text-on-band: #f7f8f6;
        --muted: #687078;
        --muted-on-band: #aeb4ba;
        --line: #dce1e4;
        --line-strong: #c8ced2;
        --line-on-band: #393d43;
        --green: #178060;
        --green-soft: #dcefe8;
        --blue: #2d67b2;
        --blue-soft: #e2ebf7;
        --coral: #c55b45;
        --coral-soft: #f6e6e1;
        --violet: #7658a6;
        --violet-soft: #ece6f5;
        --gold: #9a6a13;
        --gold-soft: #f4ecd9;
        --danger: #b7463b;
        --focus: #2767c7;
        --shadow: 0 8px 24px rgba(24, 28, 33, 0.06);
        --radius: 8px;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #111315;
        --surface: #1b1e22;
        --surface-soft: #25292e;
        --surface-raised: #202328;
        --band: #080a0c;
        --band-soft: #171a1e;
        --text: #f0f2f3;
        --text-on-band: #f7f8f6;
        --muted: #a4abb2;
        --muted-on-band: #aeb4ba;
        --line: #30353b;
        --line-strong: #424850;
        --line-on-band: #30343a;
        --green: #65c6a1;
        --green-soft: #1d3a31;
        --blue: #82ace3;
        --blue-soft: #24364e;
        --coral: #ee927f;
        --coral-soft: #482d29;
        --violet: #b79ae2;
        --violet-soft: #392f4b;
        --gold: #dfb563;
        --gold-soft: #413821;
        --danger: #ef8c82;
        --focus: #7db0f3;
        --shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        color: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      input,
      select,
      textarea {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
        opacity: 0.82;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        margin: 0;
        accent-color: var(--green);
        cursor: pointer;
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .wrap {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
      }

      .site-header {
        border-bottom: 1px solid var(--line);
        background: var(--page);
      }

      .header-inner {
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: var(--text);
        color: var(--page);
        font-size: 15px;
        font-weight: 900;
      }

      .brand-copy {
        min-width: 0;
        display: grid;
        gap: 2px;
      }

      .brand-name {
        font-size: 14px;
        font-weight: 850;
        line-height: 1.2;
      }

      .brand-subtitle {
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        line-height: 1.2;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .icon-control,
      .small-icon-button {
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        line-height: 1;
      }

      .icon-control {
        width: 38px;
        height: 38px;
        font-size: 17px;
      }

      .small-icon-button {
        width: 34px;
        height: 34px;
        font-size: 18px;
      }

      .icon-control:hover,
      .small-icon-button:hover {
        border-color: var(--line-strong);
        background: var(--surface-soft);
      }

      .day-band {
        background: var(--band);
        color: var(--text-on-band);
      }

      .day-layout {
        min-height: 232px;
        display: grid;
        grid-template-columns: minmax(0, 1.18fr) minmax(480px, 0.82fr);
        align-items: stretch;
        gap: 48px;
      }

      .day-lead {
        min-width: 0;
        align-self: center;
        padding: 30px 0 34px;
      }

      .date-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 23px;
      }

      .date-button,
      .today-button {
        min-height: 34px;
        border: 1px solid var(--line-on-band);
        border-radius: 6px;
        background: var(--band-soft);
        color: var(--text-on-band);
        cursor: pointer;
      }

      .date-button {
        width: 34px;
        display: grid;
        place-items: center;
        padding: 0;
        font-size: 18px;
      }

      .today-button {
        padding: 0 12px;
        font-size: 12px;
        font-weight: 800;
      }

      .date-button:hover,
      .today-button:hover {
        border-color: #656b73;
      }

      .planner-date {
        width: 150px;
        min-height: 34px;
        padding: 0 9px;
        border-color: var(--line-on-band);
        background: var(--band-soft);
        color: var(--text-on-band);
        color-scheme: dark;
        font-size: 12px;
        font-weight: 750;
      }

      .full-date {
        margin: 0 0 6px;
        color: #6ed2aa;
        font-size: 13px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.16;
        font-weight: 850;
        letter-spacing: 0;
      }

      .day-prompt {
        margin: 11px 0 0;
        color: var(--muted-on-band);
        font-size: 14px;
        line-height: 1.6;
      }

      .day-summary {
        min-width: 0;
        display: grid;
        grid-template-columns: 0.82fr 0.82fr 1.36fr;
        align-items: center;
        border-left: 1px solid var(--line-on-band);
      }

      .summary-item {
        min-width: 0;
        min-height: 92px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 22px;
        border-right: 1px solid var(--line-on-band);
      }

      .summary-item:last-child {
        border-right: 0;
      }

      .summary-label {
        margin-bottom: 8px;
        color: var(--muted-on-band);
        font-size: 10px;
        font-weight: 850;
      }

      .summary-value {
        overflow: hidden;
        color: var(--text-on-band);
        font-size: 23px;
        line-height: 1.2;
        font-weight: 820;
        font-variant-numeric: tabular-nums;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .summary-value--small {
        font-size: 15px;
      }

      .summary-detail {
        margin-top: 5px;
        overflow: hidden;
        color: var(--muted-on-band);
        font-size: 11px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .progress-track {
        width: 100%;
        height: 4px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--band-soft);
      }

      .progress-fill {
        width: 0;
        height: 100%;
        background: #6ed2aa;
        transition: width 180ms ease;
      }

      .main-content {
        padding: 30px 0 52px;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        align-items: start;
        gap: 16px;
      }

      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .priority-panel,
      .schedule-panel {
        grid-column: span 7;
      }

      .week-panel,
      .tasks-panel {
        grid-column: span 5;
      }

      .notes-panel {
        grid-column: 1 / -1;
      }

      .panel-header {
        min-height: 66px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }

      .panel-heading {
        min-width: 0;
      }

      .panel-kicker,
      .section-kicker {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 850;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 830;
        letter-spacing: 0;
      }

      .panel-count,
      .week-range {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
      }

      .panel-body {
        padding: 16px 18px 18px;
      }

      .priority-list {
        display: grid;
      }

      .priority-row {
        min-height: 56px;
        display: grid;
        grid-template-columns: 18px 30px minmax(0, 1fr);
        align-items: center;
        gap: 11px;
        border-bottom: 1px solid var(--line);
      }

      .priority-row:last-child {
        border-bottom: 0;
      }

      .priority-index {
        color: var(--muted);
        font-size: 11px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .priority-input,
      .row-text {
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--text);
      }

      .priority-input {
        height: 42px;
        padding: 0;
        font-size: 14px;
        font-weight: 680;
      }

      .priority-row:has(input[type="checkbox"]:checked) .priority-input,
      .list-row:has(input[type="checkbox"]:checked) .row-text {
        color: var(--muted);
        text-decoration: line-through;
      }

      .priority-input:focus,
      .row-text:focus {
        outline: 0;
      }

      .priority-row:focus-within {
        box-shadow: inset 3px 0 0 var(--green);
      }

      .week-fields {
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .week-textarea,
      .notes-textarea {
        width: 100%;
        resize: vertical;
        line-height: 1.6;
      }

      .week-textarea {
        min-height: 72px;
        padding: 10px 11px;
        font-size: 13px;
      }

      .milestone-input {
        width: 100%;
        min-height: 38px;
        padding: 0 11px;
        font-size: 13px;
      }

      .range-line {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 42px;
        align-items: center;
        gap: 12px;
      }

      .week-progress {
        width: 100%;
        accent-color: var(--violet);
        cursor: pointer;
      }

      .range-value {
        color: var(--violet);
        font-size: 12px;
        font-weight: 850;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .entry-form {
        display: grid;
        gap: 8px;
        margin-bottom: 11px;
      }

      .block-form {
        grid-template-columns: 88px 88px 98px minmax(0, 1fr) 38px;
        align-items: end;
      }

      .task-form {
        grid-template-columns: minmax(0, 1fr) 106px 38px;
      }

      .compact-field {
        min-width: 0;
        display: grid;
        gap: 4px;
      }

      .compact-label {
        color: var(--muted);
        font-size: 9px;
        font-weight: 850;
      }

      .entry-form input,
      .entry-form select {
        width: 100%;
        min-height: 38px;
        padding: 0 10px;
        font-size: 12px;
      }

      .add-button {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid var(--text);
        border-radius: 6px;
        background: var(--text);
        color: var(--page);
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
      }

      .add-button:hover {
        opacity: 0.88;
      }

      .list {
        display: grid;
      }

      .list-row {
        min-width: 0;
        min-height: 48px;
        display: grid;
        align-items: center;
        gap: 9px;
        border-bottom: 1px solid var(--line);
      }

      .list-row:last-child {
        border-bottom: 0;
      }

      .task-row {
        grid-template-columns: 18px 92px minmax(0, 1fr) 30px;
      }

      .row-category {
        width: 100%;
        min-height: 32px;
        padding: 0 6px;
        border-color: transparent;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
      }

      .row-category:hover,
      .row-category:focus {
        border-color: var(--line);
        background: var(--surface-raised);
      }

      .row-text {
        height: 38px;
        padding: 0 2px;
        font-size: 13px;
      }

      .delete-button {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }

      .delete-button:hover {
        background: var(--coral-soft);
        color: var(--danger);
      }

      .empty-state {
        min-height: 74px;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      .schedule-tools {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .calendar-export {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
        font-size: 10px;
        font-weight: 800;
      }

      .calendar-export:hover {
        border-color: var(--line-strong);
        color: var(--text);
      }

      .timeline-legend {
        min-height: 32px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px 14px;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .legend-swatch {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: var(--legend-color);
      }

      .legend-item[data-category="research"] {
        --legend-color: var(--green);
      }

      .legend-item[data-category="course"] {
        --legend-color: var(--blue);
      }

      .legend-item[data-category="life"] {
        --legend-color: var(--gold);
      }

      .legend-item[data-category="health"] {
        --legend-color: var(--coral);
      }

      .timeline-scroll {
        position: relative;
        height: 560px;
        overflow-x: hidden;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface-raised);
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }

      .timeline-canvas {
        position: relative;
        min-width: 0;
        height: 1440px;
        cursor: crosshair;
      }

      .timeline-grid,
      .timeline-events {
        position: absolute;
        inset: 0;
      }

      .timeline-grid {
        pointer-events: none;
      }

      .timeline-events {
        left: 52px;
        right: 5px;
      }

      .timeline-hour,
      .timeline-half-hour {
        position: absolute;
        right: 0;
        left: 0;
        border-top: 1px solid var(--line);
      }

      .timeline-half-hour {
        left: 52px;
        border-top-style: dashed;
        opacity: 0.58;
      }

      .timeline-hour-label {
        position: absolute;
        top: -7px;
        left: 7px;
        width: 38px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 750;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .timeline-hour:first-child .timeline-hour-label {
        top: 4px;
      }

      .time-block {
        --block-color: var(--green);
        --block-soft: var(--green-soft);
        position: absolute;
        min-width: 0;
        overflow: hidden;
        padding: 5px 7px;
        border: 1px solid color-mix(in srgb, var(--block-color) 42%, var(--line));
        border-left: 4px solid var(--block-color);
        border-radius: 5px;
        background: var(--block-soft);
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }

      .time-block:hover,
      .time-block:focus-visible {
        z-index: 3;
        border-color: var(--block-color);
      }

      .time-block[data-category="research"] {
        --block-color: var(--green);
        --block-soft: var(--green-soft);
      }

      .time-block[data-category="course"] {
        --block-color: var(--blue);
        --block-soft: var(--blue-soft);
      }

      .time-block[data-category="life"] {
        --block-color: var(--gold);
        --block-soft: var(--gold-soft);
      }

      .time-block[data-category="health"] {
        --block-color: var(--coral);
        --block-soft: var(--coral-soft);
      }

      .time-block[data-done="true"] {
        opacity: 0.58;
      }

      .time-block[data-done="true"] .time-block-title {
        text-decoration: line-through;
      }

      .time-block-title,
      .time-block-meta {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .time-block-title {
        font-size: 11px;
        line-height: 1.25;
        font-weight: 820;
      }

      .time-block-meta {
        margin-top: 3px;
        color: color-mix(in srgb, var(--block-color) 78%, var(--text));
        font-size: 9px;
        line-height: 1.2;
        font-weight: 780;
        font-variant-numeric: tabular-nums;
      }

      .time-block[data-compact="true"] {
        padding-top: 3px;
        padding-bottom: 3px;
      }

      .time-block[data-compact="true"] .time-block-meta {
        display: none;
      }

      .timeline-empty {
        position: absolute;
        z-index: 1;
        top: 31%;
        right: 20px;
        left: 72px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        text-align: center;
        pointer-events: none;
      }

      .current-time-line {
        position: absolute;
        z-index: 4;
        right: 5px;
        left: 45px;
        border-top: 2px solid var(--coral);
        pointer-events: none;
      }

      .current-time-line::before {
        content: "";
        position: absolute;
        top: -5px;
        left: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--coral);
      }

      .current-time-label {
        position: absolute;
        top: -10px;
        right: 4px;
        padding: 2px 4px;
        border-radius: 4px;
        background: var(--coral);
        color: #ffffff;
        font-size: 8px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .block-dialog {
        width: min(440px, calc(100% - 24px));
        max-height: calc(100vh - 32px);
        padding: 0;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }

      .block-dialog::backdrop {
        background: rgba(7, 9, 11, 0.58);
      }

      .dialog-form {
        display: grid;
      }

      .dialog-header {
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--line);
      }

      .dialog-title {
        margin: 0;
        font-size: 16px;
        font-weight: 830;
      }

      .dialog-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 10px;
        padding: 16px;
      }

      .dialog-field {
        min-width: 0;
        display: grid;
        gap: 6px;
      }

      .dialog-field--wide {
        grid-column: 1 / -1;
      }

      .dialog-field input,
      .dialog-field select {
        width: 100%;
        min-height: 40px;
        padding: 0 10px;
        font-size: 13px;
      }

      .done-control {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .dialog-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 16px;
        border-top: 1px solid var(--line);
      }

      .dialog-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dialog-button {
        min-height: 36px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font-size: 11px;
        font-weight: 820;
      }

      .dialog-button--primary {
        border-color: var(--text);
        background: var(--text);
        color: var(--page);
      }

      .dialog-button--danger {
        border-color: transparent;
        color: var(--danger);
      }

      .dialog-button:hover {
        border-color: var(--line-strong);
      }

      .task-header-tools {
        display: flex;
        align-items: center;
      }

      .segmented {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface-soft);
      }

      .segment-button {
        min-height: 27px;
        padding: 0 9px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 10px;
        font-weight: 800;
      }

      .segment-button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 4px rgba(24, 28, 33, 0.1);
      }

      .notes-textarea {
        min-height: 132px;
        padding: 12px 13px;
        font-size: 13px;
      }

      .systems-section {
        margin-top: 34px;
      }

      .section-head {
        min-height: 58px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 13px;
      }

      .system-count {
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
        white-space: nowrap;
      }

      .apps-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .app-card {
        --app-accent: var(--blue);
        min-width: 0;
        min-height: 158px;
        display: flex;
        flex-direction: column;
        padding: 15px;
        border: 1px solid var(--line);
        border-top: 3px solid var(--app-accent);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .app-card:hover {
        border-right-color: var(--line-strong);
        border-bottom-color: var(--line-strong);
        border-left-color: var(--line-strong);
      }

      .app-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .app-mark {
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: color-mix(in srgb, var(--app-accent) 14%, var(--surface));
        color: var(--app-accent);
        font-size: 11px;
        font-weight: 900;
      }

      .health {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 850;
      }

      .health-dot {
        width: 6px;
        height: 6px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: currentColor;
      }

      .health[data-health="online"] {
        color: var(--green);
      }

      .health[data-health="offline"] {
        color: var(--danger);
      }

      .health[data-health="sso"] {
        color: var(--violet);
      }

      .app-domain {
        margin: 13px 0 3px;
        color: var(--app-accent);
        font-size: 9px;
        font-weight: 850;
      }

      .app-name {
        margin: 0;
        overflow: hidden;
        font-size: 14px;
        line-height: 1.3;
        font-weight: 820;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .app-actions {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: auto;
        padding-top: 14px;
      }

      .open-app {
        min-height: 32px;
        flex: 1 1 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 9px;
        border: 1px solid var(--app-accent);
        border-radius: 6px;
        background: var(--app-accent);
        color: #ffffff;
        font-size: 11px;
        font-weight: 820;
      }

      .repo-link {
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .open-app:hover {
        filter: brightness(0.93);
      }

      .repo-link:hover {
        border-color: var(--line-strong);
        color: var(--text);
      }

      .footer {
        border-top: 1px solid var(--line);
      }

      .footer-inner {
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
      }

      .save-state {
        color: var(--text);
        font-weight: 750;
      }

      @media (max-width: 1040px) {
        .day-layout {
          grid-template-columns: minmax(0, 1fr) 430px;
          gap: 28px;
        }

        .summary-item {
          padding: 0 15px;
        }

        .apps-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 860px) {
        .day-layout {
          grid-template-columns: 1fr;
          gap: 0;
        }

        .day-lead {
          padding-bottom: 26px;
        }

        .day-summary {
          min-height: 108px;
          border-top: 1px solid var(--line-on-band);
          border-left: 0;
        }

        .priority-panel,
        .schedule-panel,
        .week-panel,
        .tasks-panel {
          grid-column: 1 / -1;
        }

        .apps-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 600px) {
        .wrap {
          width: min(100% - 24px, 1180px);
        }

        .brand-subtitle {
          display: none;
        }

        .header-actions {
          gap: 5px;
        }

        .icon-control {
          width: 34px;
          height: 34px;
        }

        .day-lead {
          padding-top: 25px;
        }

        h1 {
          font-size: 27px;
        }

        .day-summary {
          grid-template-columns: 0.8fr 0.8fr 1.4fr;
        }

        .summary-item {
          min-height: 84px;
          padding: 0 10px;
        }

        .summary-value {
          font-size: 18px;
        }

        .summary-value--small {
          font-size: 12px;
        }

        .summary-detail {
          font-size: 9px;
        }

        .main-content {
          padding-top: 20px;
        }

        .dashboard-grid {
          gap: 12px;
        }

        .panel-header,
        .panel-body {
          padding-right: 14px;
          padding-left: 14px;
        }

        .block-form {
          grid-template-columns: 1fr 1fr 38px;
        }

        .block-form .compact-field--category {
          grid-column: 1;
          grid-row: 2;
        }

        .block-form .compact-field--text {
          grid-column: 2 / -1;
          grid-row: 2;
        }

        .block-form .add-button {
          grid-column: 3;
          grid-row: 1;
        }

        .task-form {
          grid-template-columns: minmax(0, 1fr) 38px;
        }

        .task-form select {
          grid-column: 1 / -1;
          grid-row: 2;
        }

        .task-form .add-button {
          grid-column: 2;
          grid-row: 1;
        }

        .schedule-panel .panel-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }

        .schedule-tools {
          width: 100%;
          justify-content: space-between;
        }

        .timeline-scroll {
          height: min(62vh, 540px);
          scrollbar-gutter: auto;
        }

        .timeline-canvas {
          height: 1248px;
        }

        .timeline-events {
          left: 46px;
        }

        .timeline-half-hour {
          left: 46px;
        }

        .timeline-hour-label {
          left: 3px;
          width: 36px;
        }

        .current-time-line {
          left: 39px;
        }

        .time-block {
          padding-right: 5px;
          padding-left: 5px;
        }

        .task-row {
          grid-template-columns: 18px 82px minmax(0, 1fr) 30px;
        }

        .task-header-tools {
          width: 100%;
        }

        .tasks-panel .panel-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }

        .apps-grid {
          grid-template-columns: 1fr;
        }

        .app-card {
          min-height: 146px;
        }

        .block-dialog {
          width: 100%;
          max-width: none;
          max-height: 88vh;
          margin: auto 0 0;
          border-right: 0;
          border-bottom: 0;
          border-left: 0;
          border-radius: 8px 8px 0 0;
        }

        .dialog-body {
          grid-template-columns: 1fr;
        }

        .dialog-field--wide {
          grid-column: auto;
        }

        .footer-inner {
          min-height: 84px;
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          gap: 5px;
        }
      }

      @media (max-width: 420px) {
        .brand-copy {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="/admin/" aria-label="研究生生活驾驶舱首页">
          <span class="brand-mark" aria-hidden="true">研</span>
          <span class="brand-copy">
            <span class="brand-name">研究生生活驾驶舱</span>
            <span class="brand-subtitle">Study · Life · Rhythm</span>
          </span>
        </a>

        <div class="header-actions">
          <button
            class="icon-control"
            id="exportButton"
            type="button"
            aria-label="导出生活驾驶舱备份"
            title="导出备份"
          >
            <span aria-hidden="true">⇩</span>
          </button>
          <button
            class="icon-control"
            id="importButton"
            type="button"
            aria-label="导入生活驾驶舱备份"
            title="导入备份"
          >
            <span aria-hidden="true">⇧</span>
          </button>
          <input
            class="sr-only"
            id="importFile"
            type="file"
            accept="application/json,.json"
          />
          <a
            class="icon-control"
            href="/"
            aria-label="返回个人主页"
            title="返回个人主页"
          >
            <span aria-hidden="true">⌂</span>
          </a>
          <button
            class="icon-control"
            id="themeToggle"
            type="button"
            aria-label="切换深浅色模式"
            title="切换深浅色模式"
          >
            <span id="themeIcon" aria-hidden="true">☾</span>
          </button>
        </div>
      </div>
    </header>

    <section class="day-band" aria-labelledby="pageTitle">
      <div class="wrap day-layout">
        <div class="day-lead">
          <div class="date-toolbar">
            <button
              class="date-button"
              id="previousDay"
              type="button"
              aria-label="前一天"
              title="前一天"
            >
              <span aria-hidden="true">←</span>
            </button>
            <label class="sr-only" for="plannerDate">选择日期</label>
            <input class="planner-date" id="plannerDate" type="date" />
            <button
              class="date-button"
              id="nextDay"
              type="button"
              aria-label="后一天"
              title="后一天"
            >
              <span aria-hidden="true">→</span>
            </button>
            <button class="today-button" id="todayButton" type="button">
              今天
            </button>
          </div>

          <p class="full-date" id="fullDate">今天</p>
          <h1 id="pageTitle">研究生生活驾驶舱</h1>
          <p class="day-prompt" id="dayPrompt">先完成最重要的一件事。</p>
        </div>

        <div class="day-summary" aria-label="当日概览">
          <div class="summary-item">
            <span class="summary-label">本地时间</span>
            <time class="summary-value" id="clock">00:00</time>
            <span class="summary-detail" id="greeting">你好</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">计划完成</span>
            <span class="summary-value" id="completionValue">0 / 0</span>
            <div class="progress-track" aria-hidden="true">
              <div class="progress-fill" id="completionBar"></div>
            </div>
          </div>
          <div class="summary-item">
            <span class="summary-label">下一个时间块</span>
            <span class="summary-value summary-value--small" id="nextBlockTitle">
              暂无安排
            </span>
            <span class="summary-detail" id="nextBlockTime">留给自由推进</span>
          </div>
        </div>
      </div>
    </section>

    <main class="wrap main-content">
      <div class="dashboard-grid">
        <section class="panel priority-panel" aria-labelledby="priorityTitle">
          <header class="panel-header">
            <div class="panel-heading">
              <p class="panel-kicker">DAILY FOCUS</p>
              <h2 id="priorityTitle">今日三件事</h2>
            </div>
            <span class="panel-count" id="priorityCount">0 / 3</span>
          </header>
          <div class="panel-body">
            <div class="priority-list" id="priorityList"></div>
          </div>
        </section>

        <section class="panel week-panel" aria-labelledby="weekTitle">
          <header class="panel-header">
            <div class="panel-heading">
              <p class="panel-kicker">RESEARCH</p>
              <h2 id="weekTitle">本周研究推进</h2>
            </div>
            <span class="week-range" id="weekRange"></span>
          </header>
          <div class="panel-body week-fields">
            <label class="field">
              <span class="field-label">本周研究主线</span>
              <textarea
                class="week-textarea"
                id="weekGoal"
                maxlength="800"
                placeholder="这一周最需要推进的研究问题"
              ></textarea>
            </label>
            <label class="field">
              <span class="field-label">下一里程碑</span>
              <input
                class="milestone-input"
                id="weekMilestone"
                type="text"
                maxlength="240"
                placeholder="下一份可以交付或验证的结果"
              />
            </label>
            <label class="field">
              <span class="field-label">推进程度</span>
              <span class="range-line">
                <input
                  class="week-progress"
                  id="weekProgress"
                  type="range"
                  min="0"
                  max="100"
                  step="5"
                  value="0"
                />
                <output class="range-value" id="weekProgressValue">0%</output>
              </span>
            </label>
          </div>
        </section>

        <section class="panel schedule-panel" aria-labelledby="scheduleTitle">
          <header class="panel-header">
            <div class="panel-heading">
              <p class="panel-kicker">TIME BLOCKS</p>
              <h2 id="scheduleTitle">24 小时时间轴</h2>
            </div>
            <div class="schedule-tools">
              <span class="panel-count" id="scheduleCount">0 个时间块</span>
              <button
                class="calendar-export"
                id="exportCalendarButton"
                type="button"
                title="导出当天日程"
              >
                <span aria-hidden="true">⇩</span>
                日历
              </button>
            </div>
          </header>
          <div class="panel-body">
            <form class="entry-form block-form" id="blockForm">
              <label class="compact-field">
                <span class="compact-label">开始</span>
                <input id="blockStart" type="time" step="900" max="23:30" required />
              </label>
              <label class="compact-field">
                <span class="compact-label">结束</span>
                <input id="blockEnd" type="time" step="900" max="23:59" required />
              </label>
              <label class="compact-field compact-field--category">
                <span class="compact-label">类别</span>
                <select id="blockCategory">
                  <option value="research">研究</option>
                  <option value="course">课程</option>
                  <option value="life">生活</option>
                  <option value="health">健康</option>
                </select>
              </label>
              <label class="compact-field compact-field--text">
                <span class="compact-label">事项</span>
                <input
                  class="entry-text"
                  id="blockText"
                  type="text"
                  maxlength="240"
                  placeholder="添加一个时间块"
                  autocomplete="off"
                  required
                />
              </label>
              <button class="add-button" type="submit" aria-label="添加时间块" title="添加">
                <span aria-hidden="true">＋</span>
              </button>
            </form>
            <div class="timeline-legend" aria-label="时间块类别">
              <span class="legend-item" data-category="research">
                <span class="legend-swatch" aria-hidden="true"></span>研究
              </span>
              <span class="legend-item" data-category="course">
                <span class="legend-swatch" aria-hidden="true"></span>课程
              </span>
              <span class="legend-item" data-category="life">
                <span class="legend-swatch" aria-hidden="true"></span>生活
              </span>
              <span class="legend-item" data-category="health">
                <span class="legend-swatch" aria-hidden="true"></span>健康
              </span>
            </div>
            <div
              class="timeline-scroll"
              id="timelineScroll"
              tabindex="0"
              aria-label="当天 24 小时时间轴"
            >
              <div class="timeline-canvas" id="timelineCanvas">
                <div class="timeline-grid" id="timelineGrid" aria-hidden="true"></div>
                <div class="timeline-events" id="timelineEvents"></div>
                <div class="current-time-line" id="currentTimeLine" hidden>
                  <span class="current-time-label" id="currentTimeLabel"></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="panel tasks-panel" aria-labelledby="tasksTitle">
          <header class="panel-header">
            <div class="panel-heading">
              <p class="panel-kicker">TASK POOL</p>
              <h2 id="tasksTitle">待办池</h2>
            </div>
            <div class="task-header-tools">
              <div class="segmented" aria-label="筛选待办">
                <button
                  class="segment-button"
                  type="button"
                  data-task-filter="open"
                  aria-pressed="true"
                >
                  待办
                </button>
                <button
                  class="segment-button"
                  type="button"
                  data-task-filter="all"
                  aria-pressed="false"
                >
                  全部
                </button>
                <button
                  class="segment-button"
                  type="button"
                  data-task-filter="done"
                  aria-pressed="false"
                >
                  完成
                </button>
              </div>
            </div>
          </header>
          <div class="panel-body">
            <form class="entry-form task-form" id="taskForm">
              <label class="sr-only" for="taskText">待办内容</label>
              <input
                id="taskText"
                type="text"
                maxlength="240"
                placeholder="记下一个待办"
                autocomplete="off"
                required
              />
              <label class="sr-only" for="taskCategory">类别</label>
              <select id="taskCategory">
                <option value="research">研究</option>
                <option value="course">课程</option>
                <option value="life" selected>生活</option>
                <option value="health">健康</option>
              </select>
              <button class="add-button" type="submit" aria-label="添加待办" title="添加">
                <span aria-hidden="true">＋</span>
              </button>
            </form>
            <div class="list" id="taskList"></div>
          </div>
        </section>

        <section class="panel notes-panel" aria-labelledby="notesTitle">
          <header class="panel-header">
            <div class="panel-heading">
              <p class="panel-kicker">QUICK NOTES</p>
              <h2 id="notesTitle">随手记</h2>
            </div>
            <span class="panel-count" id="notesCount">0 字</span>
          </header>
          <div class="panel-body">
            <label class="sr-only" for="dailyNotes">当天的随手记录</label>
            <textarea
              class="notes-textarea"
              id="dailyNotes"
              maxlength="10000"
              placeholder="想法、阅读线索、会议结论，或今天值得记住的事"
            ></textarea>
          </div>
        </section>
      </div>

      <section class="systems-section" aria-labelledby="systemsTitle">
        <header class="section-head">
          <div>
            <p class="section-kicker">MY SYSTEMS</p>
            <h2 id="systemsTitle">应用入口</h2>
          </div>
          <span class="system-count" id="systemCount">5 个入口</span>
        </header>
        <div class="apps-grid" id="appGrid"></div>
      </section>
    </main>

    <dialog class="block-dialog" id="blockDialog" aria-labelledby="blockDialogTitle">
      <form class="dialog-form" id="blockEditForm">
        <header class="dialog-header">
          <h2 class="dialog-title" id="blockDialogTitle">编辑时间块</h2>
          <button
            class="small-icon-button"
            id="closeBlockDialog"
            type="button"
            aria-label="关闭"
            title="关闭"
          >
            <span aria-hidden="true">×</span>
          </button>
        </header>
        <div class="dialog-body">
          <label class="dialog-field dialog-field--wide">

    <script>
      const STORAGE_KEY = "graduate-life-cockpit-v1";
      const STATE_VERSION = 1;
      const CATEGORY_LABELS = {

      };

      const APPS = [

      const priorityPlaceholders = [

      const elements = {

        editBlockText: document.querySelector("#editBlockText"),
        exportButton: document.querySelector("#exportButton"),
        exportCalendarButton: document.querySelector("#exportCalendarButton"),
        fullDate: document.querySelector("#fullDate"),
        greeting: document.querySelector("#greeting"),
