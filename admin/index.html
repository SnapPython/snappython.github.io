<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#181a1d" />
    <title>生活驾驶舱 | SnapPython</title>
    <meta
      name="description"
      content="SnapPython 的个人生活驾驶舱，连接记录、训练、知识、文件流转与个人空间。"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("life-cockpit-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          savedTheme || (prefersDark ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --page: #f4f5f7;
        --surface: #ffffff;
        --surface-soft: #eceef1;
        --band: #191b1f;
        --band-soft: #272a30;
        --text: #191b1f;
        --text-on-band: #f8f8f6;
        --muted: #666c75;
        --muted-on-band: #aeb3bb;
        --line: #dfe2e6;
        --line-on-band: #3a3e45;
        --online: #18845f;
        --offline: #c04737;
        --checking: #9a6a11;
        --sso: #7157a8;
        --focus: #2767c7;
        --shadow: 0 14px 34px rgba(25, 27, 31, 0.07);
        --radius: 8px;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #111315;
        --surface: #1b1e22;
        --surface-soft: #25282d;
        --band: #080a0c;
        --band-soft: #171a1e;
        --text: #f3f4f5;
        --text-on-band: #f8f8f6;
        --muted: #a4a9b1;
        --muted-on-band: #aeb3bb;
        --line: #30343a;
        --line-on-band: #2e3238;
        --online: #63c59f;
        --offline: #ef8e7f;
        --checking: #e0b45e;
        --sso: #b69ae8;
        --focus: #73a7f3;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        font: inherit;
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      .wrap {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }

      .site-header {
        min-height: 68px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--page) 92%, transparent);
      }

      .header-inner {
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 11px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--text);
        color: var(--page);
        font-size: 13px;
        font-weight: 900;
      }

      .brand-copy {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .brand-name {
        font-size: 14px;
        font-weight: 850;
        line-height: 1.2;
      }

      .brand-subtitle {
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        line-height: 1.2;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-control {
        width: 38px;
        height: 38px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }

      .icon-control:hover {
        border-color: var(--muted);
      }

      .today-band {
        background: var(--band);
        color: var(--text-on-band);
        overflow: hidden;
      }

      .today-layout {
        min-height: 286px;
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(360px, 0.8fr);
        align-items: stretch;
        gap: 52px;
      }

      .today-copy {
        align-self: center;
        padding: 42px 0 46px;
      }

      .today-date {
        margin: 0 0 17px;
        color: var(--muted-on-band);
        font-size: 13px;
        font-weight: 750;
      }

      .greeting {
        margin: 0 0 8px;
        color: #69d3a8;
        font-size: 14px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        max-width: 660px;
        font-size: 48px;
        line-height: 1.08;
        font-weight: 850;
        letter-spacing: 0;
        text-wrap: balance;
      }

      .mantra {
        margin: 18px 0 0;
        color: var(--muted-on-band);
        font-size: 15px;
        line-height: 1.7;
      }

      .today-stats {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 148px;
        align-items: center;
        border-left: 1px solid var(--line-on-band);
      }

      .clock-block {
        min-width: 0;
        padding-left: 42px;
      }

      .clock-label,
      .progress-label {
        display: block;
        color: var(--muted-on-band);
        font-size: 11px;
        font-weight: 800;
      }

      .clock {
        display: block;
        margin-top: 7px;
        font-size: 40px;
        line-height: 1;
        font-weight: 780;
        font-variant-numeric: tabular-nums;
      }

      .health-overview {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        color: var(--muted-on-band);
        font-size: 12px;
        font-weight: 700;
      }

      .health-overview-dot {
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--checking);
      }

      .health-overview[data-health="online"] .health-overview-dot {
        background: #69d3a8;
      }

      .health-overview[data-health="partial"] .health-overview-dot {
        background: #efbd64;
      }

      .progress-block {
        display: grid;
        justify-items: center;
        gap: 10px;
      }

      .day-progress {
        --progress: 0;
        position: relative;
        width: 112px;
        height: 112px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(
          #69d3a8 calc(var(--progress) * 1%),
          var(--band-soft) 0
        );
      }

      .day-progress::after {
        content: "";
        position: absolute;
        inset: 9px;
        border-radius: 50%;
        background: var(--band);
      }

      .progress-value {
        position: relative;
        z-index: 1;
        font-size: 20px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .main-content {
        padding: 42px 0 56px;
      }

      .section-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 20px;
      }

      .section-kicker {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      h2 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 830;
        letter-spacing: 0;
      }

      .system-count {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .apps-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 14px;
      }

      .app-card {
        --app-accent: #2767c7;
        position: relative;
        min-width: 0;
        min-height: 238px;
        display: flex;
        flex-direction: column;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
        grid-column: span 2;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .app-card--primary {
        grid-column: span 3;
      }

      .app-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--app-accent);
      }

      .app-card:hover {
        transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--app-accent) 52%, var(--line));
        box-shadow: 0 18px 42px rgba(25, 27, 31, 0.11);
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .app-identity {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .app-mark {
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--surface-soft);
        background: color-mix(
          in srgb,
          var(--app-accent) 13%,
          var(--surface)
        );
        color: var(--app-accent);
        font-size: 14px;
        font-weight: 900;
      }

      .app-domain {
        margin: 0 0 4px;
        color: var(--app-accent);
        font-size: 11px;
        font-weight: 850;
      }

      .app-name {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        font-weight: 830;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .health {
        flex: 0 0 auto;
        min-width: 62px;
        min-height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--checking);
        font-size: 11px;
        font-weight: 800;
      }

      .health-dot {
        width: 6px;
        height: 6px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: currentColor;
      }

      .health[data-health="online"] {
        color: var(--online);
      }

      .health[data-health="offline"] {
        color: var(--offline);
      }

      .health[data-health="sso"] {
        color: var(--sso);
      }

      .health[data-health="checking"] .health-dot {
        animation: pulse 1.2s ease-in-out infinite;
      }

      .app-description {
        margin: 22px 0 24px;
        max-width: 480px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: auto;
      }

      .open-app,
      .repo-link {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 820;
      }

      .open-app {
        padding: 0 14px;
        border: 1px solid var(--app-accent);
        background: var(--app-accent);
        color: #ffffff;
      }

      .repo-link {
        padding: 0 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
      }

      .open-app:hover {
        filter: brightness(0.94);
      }

      .repo-link:hover {
        border-color: var(--muted);
        color: var(--text);
      }

      .footer {
        border-top: 1px solid var(--line);
      }

      .footer-inner {
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .footer-mantra {
        color: var(--text);
        font-weight: 780;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }

      @media (max-width: 860px) {
        .today-layout {
          grid-template-columns: 1fr;
          gap: 0;
        }

        .today-copy {
          padding-bottom: 28px;
        }

        .today-stats {
          grid-template-columns: minmax(0, 1fr) 132px;
          min-height: 154px;
          border-top: 1px solid var(--line-on-band);
          border-left: 0;
        }

        .clock-block {
          padding-left: 0;
        }

        .apps-grid {
          grid-template-columns: 1fr;
        }

        .app-card,
        .app-card--primary {
          grid-column: auto;
        }
      }

      @media (max-width: 560px) {
        .wrap {
          width: min(100% - 24px, 1120px);
        }

        .brand-subtitle {
          display: none;
        }

        .today-copy {
          padding-top: 34px;
        }

        h1 {
          font-size: 34px;
        }

        .today-stats {
          grid-template-columns: minmax(0, 1fr) 112px;
        }

        .clock {
          font-size: 32px;
        }

        .day-progress {
          width: 92px;
          height: 92px;
        }

        .main-content {
          padding-top: 34px;
        }

        .section-head {
          align-items: flex-start;
        }

        h2 {
          font-size: 24px;
        }

        .app-card {
          min-height: 252px;
          padding: 18px;
        }

        .card-top {
          gap: 10px;
        }

        .app-identity {
          gap: 11px;
        }

        .app-mark {
          width: 42px;
          height: 42px;
        }

        .health {
          min-width: 26px;
          width: 26px;
          padding: 0;
        }

        .health-label {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        }

        .card-actions {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
        }

        .footer-inner {
          min-height: 88px;
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          gap: 5px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="/admin/" aria-label="生活驾驶舱首页">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span class="brand-copy">
            <span class="brand-name">SNAP / LIFE</span>
            <span class="brand-subtitle">Personal cockpit</span>
          </span>
        </a>
        <div class="header-actions">
          <a class="icon-control" href="/" aria-label="返回个人主页" title="返回个人主页">
            <span aria-hidden="true">⌂</span>
          </a>
          <button
            class="icon-control"
            id="themeToggle"
            type="button"
            aria-label="切换深浅色模式"
            title="切换深浅色模式"
          >
            <span id="themeIcon" aria-hidden="true">☾</span>
          </button>
        </div>
      </div>
    </header>

    <section class="today-band" aria-labelledby="pageTitle">
      <div class="wrap today-layout">
        <div class="today-copy">
          <p class="today-date" id="fullDate">今天</p>
          <p class="greeting" id="greeting">你好</p>
          <h1 id="pageTitle">生活驾驶舱</h1>
          <p class="mantra">记录 · 训练 · 流转 · 创造</p>
        </div>

        <div class="today-stats">
          <div class="clock-block">
            <span class="clock-label">本地时间</span>
            <time class="clock" id="clock">00:00</time>
            <span class="health-overview" id="healthOverview" data-health="checking">
              <span class="health-overview-dot" aria-hidden="true"></span>
              <span id="onlineCount">正在连接生活系统</span>
            </span>
          </div>
          <div class="progress-block">
            <div
              class="day-progress"
              id="dayProgress"
              role="img"
              aria-label="今天已过去 0%"
            >
              <span class="progress-value" id="progressValue">0%</span>
            </div>
            <span class="progress-label">今天已走过</span>
          </div>
        </div>
      </div>
    </section>

    <main class="wrap main-content">
      <section aria-labelledby="systemsTitle">
        <header class="section-head">
          <div>
            <p class="section-kicker">MY SYSTEMS</p>
            <h2 id="systemsTitle">我的生活系统</h2>
          </div>
          <span class="system-count" id="systemCount">5 个入口</span>
        </header>
        <div class="apps-grid" id="appGrid"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrap footer-inner">
        <span class="footer-mantra">把生活过成自己的作品。</span>
        <span>SnapPython · <span id="currentYear">2026</span></span>
      </div>
    </footer>

    <script>
      const APPS = [
        {
          id: "rebirth",
          name: "Re_Birth",
          domain: "身体",
          mark: "RB",
          description: "训练计划、身体数据与恢复节奏。",
          url: "https://rebirth.72-11-130-223.sslip.io:8444/",
          repoUrl: "https://github.com/SnapPython/re_birth",
          accent: "#df6248",
          access: "sso",
          size: "primary",
        },
        {
          id: "voice-daily",
          name: "Voice Daily",
          domain: "记录",
          mark: "VD",
          description: "用声音留下每天的想法与片段。",
          url: "https://snappython.github.io/voice-daily/",
          repoUrl: "https://github.com/SnapPython/voice-daily",
          accent: "#147b62",
          access: "public",
          size: "primary",
        },
        {
          id: "transfer-assistant",
          name: "Transfer Assistant",
          domain: "流转",
          mark: "TA",
          description: "在手机、平板和电脑之间快速流转文件与文字。",
          url: "https://transfer.72-11-130-223.sslip.io:8444/",
          repoUrl: "https://github.com/SnapPython/transfer-assistant",
          accent: "#2f6fca",
          access: "sso",
        },
        {
          id: "mechmind",
          name: "MechMind",
          domain: "知识",
          mark: "MM",
          description: "知识树、思考脉络与 Codex 导师。",
          url: "https://mechmind.72-11-130-223.sslip.io:8444/",
          repoUrl: "https://github.com/SnapPython/my_database",
          accent: "#7157a8",
          access: "sso",
        },
        {
          id: "homepage",
          name: "SnapPython 主页",
          domain: "空间",
          mark: "SP",
          description: "我的公开空间、项目与数字身份入口。",
          url: "https://snappython.github.io/",
          repoUrl: "https://github.com/SnapPython/snappython.github.io",
          accent: "#b67a12",
          access: "public",
        },
      ];

      const appGrid = document.querySelector("#appGrid");
      const themeToggle = document.querySelector("#themeToggle");
      const themeIcon = document.querySelector("#themeIcon");
      const fullDate = document.querySelector("#fullDate");
      const greeting = document.querySelector("#greeting");
      const clock = document.querySelector("#clock");
      const dayProgress = document.querySelector("#dayProgress");
      const progressValue = document.querySelector("#progressValue");
      const healthOverview = document.querySelector("#healthOverview");
      const onlineCount = document.querySelector("#onlineCount");

      function renderApps() {
        appGrid.innerHTML = APPS.map(
          (app) => `
            <article
              class="app-card ${app.size === "primary" ? "app-card--primary" : ""}"
              style="--app-accent: ${app.accent}"
            >
              <div class="card-top">
                <div class="app-identity">
                  <span class="app-mark" aria-hidden="true">${app.mark}</span>
                  <div>
                    <p class="app-domain">${app.domain}</p>
                    <h3 class="app-name">${app.name}</h3>
                  </div>
                </div>
                <span
                  class="health"
                  id="health-${app.id}"
                  data-health="${app.access === "sso" ? "sso" : "checking"}"
                  aria-label="${
                    app.access === "sso"
                      ? `${app.name} 需要统一登录`
                      : `${app.name} 状态检测中`
                  }"
                >
                  <span class="health-dot" aria-hidden="true"></span>
                  <span class="health-label">${
                    app.access === "sso" ? "SSO" : "检测中"
                  }</span>
                </span>
              </div>
              <p class="app-description">${app.description}</p>
              <div class="card-actions">
                <a
                  class="open-app"
                  href="${app.url}"
                  target="_blank"
                  rel="noopener"
                >
                  打开应用
                  <span aria-hidden="true">↗</span>
                </a>
                <a
                  class="repo-link"
                  href="${app.repoUrl}"
                  target="_blank"
                  rel="noopener"
                  aria-label="查看 ${app.name} 的代码仓库"
                >
                  代码
                  <span aria-hidden="true">↗</span>
                </a>
              </div>
            </article>
          `,
        ).join("");

        document.querySelector("#systemCount").textContent = `${APPS.length} 个入口`;
      }

      function updateTime() {
        const now = new Date();
        const hour = now.getHours();
        const secondsToday =
          hour * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const progress = Math.round((secondsToday / 86400) * 100);

        fullDate.textContent = new Intl.DateTimeFormat("zh-CN", {
          month: "long",
          day: "numeric",
          weekday: "long",
        }).format(now);

        clock.textContent = new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(now);

        if (hour < 5) {
          greeting.textContent = "夜深了，照顾好自己";
        } else if (hour < 11) {
          greeting.textContent = "早上好，开启今天";
        } else if (hour < 14) {
          greeting.textContent = "中午好，稍作停歇";
        } else if (hour < 18) {
          greeting.textContent = "下午好，保持节奏";
        } else if (hour < 23) {
          greeting.textContent = "晚上好，收拢今天";
        } else {
          greeting.textContent = "今天辛苦了";
        }

        dayProgress.style.setProperty("--progress", progress);
        dayProgress.setAttribute("aria-label", `今天已过去 ${progress}%`);
        progressValue.textContent = `${progress}%`;
        document.querySelector("#currentYear").textContent = now.getFullYear();
      }

      function applyThemeIcon() {
        const isDark = document.documentElement.dataset.theme === "dark";
        themeIcon.textContent = isDark ? "☀" : "☾";
        themeToggle.setAttribute(
          "aria-label",
          isDark ? "切换到浅色模式" : "切换到深色模式",
        );
      }

      themeToggle.addEventListener("click", () => {
        const nextTheme =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        try {
          localStorage.setItem("life-cockpit-theme", nextTheme);
        } catch {
          // The selected theme still applies for the current page.
        }
        applyThemeIcon();
      });

      async function checkApp(app) {
        if (app.access === "sso") return null;

        const status = document.querySelector(`#health-${app.id}`);
        const label = status.querySelector(".health-label");
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 8000);

        try {
          const response = await fetch(app.url, {
            method: "HEAD",
            cache: "no-store",
            signal: controller.signal,
          });
          const isOnline = response.ok;
          status.dataset.health = isOnline ? "online" : "offline";
          label.textContent = isOnline ? "在线" : "不可用";
          status.setAttribute(
            "aria-label",
            `${app.name} ${isOnline ? "在线" : "暂时不可用"}`,
          );
          return isOnline;
        } catch {
          status.dataset.health = "offline";
          label.textContent = "未连接";
          status.setAttribute("aria-label", `${app.name} 状态未确认`);
          return false;
        } finally {
          window.clearTimeout(timeout);
        }
      }

      async function checkAllApps() {
        const results = await Promise.all(APPS.map(checkApp));
        const online = results.filter(Boolean).length;
        const publicCount = APPS.filter((app) => app.access === "public").length;
        const ssoCount = APPS.length - publicCount;
        onlineCount.textContent = `${online}/${publicCount} 个公开系统在线 · ${ssoCount} 个 SSO`;
        healthOverview.dataset.health =
          online === publicCount ? "online" : "partial";
      }

      renderApps();
      updateTime();
      applyThemeIcon();
      checkAllApps();
      window.setInterval(updateTime, 30000);
    </script>
  </body>
</html>
