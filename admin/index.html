<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | SnapPython Apps</title>
    <meta
      name="description"
      content="SnapPython GitHub Pages applications dashboard."
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-strong: #111827;
        --text: #111827;
        --muted: #667085;
        --line: #d8dee8;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --warning: #b45309;
        --shadow: 0 18px 42px rgba(17, 24, 39, 0.09);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(246, 247, 249, 0.98)),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 44px;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent-strong);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: 0;
      }

      .summary {
        margin: 12px 0 0;
        max-width: 680px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .home-link {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
        box-shadow: 0 8px 20px rgba(17, 24, 39, 0.05);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 26px 0 18px;
      }

      .metric {
        min-height: 92px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .metric .value {
        display: block;
        font-size: 30px;
        line-height: 1;
        font-weight: 800;
      }

      .metric .label {
        display: block;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        margin: 18px 0;
      }

      .search {
        position: relative;
      }

      .search input {
        width: 100%;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        outline: none;
        box-shadow: 0 8px 20px rgba(17, 24, 39, 0.04);
      }

      .search input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      }

      .filters {
        display: inline-flex;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .filter {
        min-height: 34px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
      }

      .filter[aria-pressed="true"] {
        background: var(--surface-strong);
        color: #ffffff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .app-card {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 16px;
        min-height: 170px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: var(--radius);
        background: #e8f3f1;
        color: var(--accent-strong);
        font-size: 18px;
        font-weight: 900;
      }

      .card-main {
        min-width: 0;
      }

      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .app-name {
        margin: 0;
        min-width: 0;
        font-size: 20px;
        line-height: 1.25;
        font-weight: 800;
        word-break: break-word;
      }

      .status {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
      }

      .status.built {
        background: #def7ec;
        color: #03543f;
      }

      .status.building {
        background: #fef3c7;
        color: var(--warning);
      }

      .description {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 16px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 12px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        font-size: 13px;
        font-weight: 800;
      }

      .action.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .empty {
        display: none;
        margin-top: 18px;
        padding: 28px;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        text-align: center;
        font-weight: 700;
      }

      .footer {
        margin-top: 28px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      @media (max-width: 760px) {
        .shell {
          width: min(100% - 24px, 1180px);
          padding-top: 22px;
        }

        .topbar,
        .toolbar {
          display: block;
        }

        .home-link {
          margin-top: 16px;
        }

        .metrics,
        .grid {
          grid-template-columns: 1fr;
        }

        .filters {
          width: 100%;
          margin-top: 10px;
          justify-content: space-between;
        }

        .filter {
          flex: 1;
        }

        .app-card {
          grid-template-columns: 1fr;
        }

        .card-head {
          display: block;
        }

        .status {
          margin-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GitHub Pages</p>
          <h1>应用管理台</h1>
          <p class="summary">
            汇总 SnapPython 账号下已启用 GitHub Pages 的网页应用，按状态筛选并快速跳转到线上页面或仓库。
          </p>
        </div>
        <a class="home-link" href="/">返回主页</a>
      </header>

      <section class="metrics" aria-label="应用概览">
        <div class="metric">
          <span class="value" id="totalCount">0</span>
          <span class="label">全部入口</span>
        </div>
        <div class="metric">
          <span class="value" id="builtCount">0</span>
          <span class="label">已构建</span>
        </div>
        <div class="metric">
          <span class="value" id="buildingCount">0</span>
          <span class="label">构建中</span>
        </div>
      </section>

      <section class="toolbar" aria-label="筛选工具">
        <label class="search">
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="搜索应用、描述或仓库名"
          />
        </label>
        <div class="filters" role="group" aria-label="状态筛选">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">
            全部
          </button>
          <button class="filter" type="button" data-filter="built" aria-pressed="false">
            已构建
          </button>
          <button class="filter" type="button" data-filter="building" aria-pressed="false">
            构建中
          </button>
        </div>
      </section>

      <section class="grid" id="appGrid" aria-live="polite"></section>
      <div class="empty" id="emptyState">没有匹配的应用。</div>

      <p class="footer">
        最近更新：2026-07-10。Re_Birth / Transfer Assistant / MechMind 已迁移至 Authelia SSO 统一登录入口；新增应用后可在此页面的 APPS 数组中补充。
      </p>
    </main>

    <script>
      const APPS = [
        {
          name: "SnapPython 主页",
          repo: "snappython.github.io",
          description: "个人主页与项目导航站点。",
          url: "https://snappython.github.io/",
          repoUrl: "https://github.com/SnapPython/snappython.github.io",
          source: "gh-pages /",
          visibility: "public",
          status: "built",
          updated: "2025-09-02",
        },
        {
          name: "Re_Birth",
          repo: "re_birth",
          description: "Re_Birth fitness coach。经 Authelia SSO 统一登录。",
          url: "https://rebirth.72-11-130-223.sslip.io:8444/",
          repoUrl: "https://github.com/SnapPython/re_birth",
          source: "VPS Caddy + SSO",
          visibility: "private repo, SSO protected",
          status: "built",
          updated: "2026-07-10",
        },
        {
          name: "Transfer Assistant",
          repo: "transfer-assistant",
          description: "自托管传输助手。经 Authelia SSO 统一登录。",
          url: "https://transfer.72-11-130-223.sslip.io:8444/",
          repoUrl: "https://github.com/SnapPython/transfer-assistant",
          source: "VPS Caddy + SSO",
          visibility: "public repo, SSO protected",
          status: "built",
          updated: "2026-07-10",
        },
        {
          name: "MechMind",
          repo: "my_database",
          description: "MechMind 知识树与 Codex 导师。经 Authelia SSO 统一登录。",
          url: "https://mechmind.72-11-130-223.sslip.io:8444/",
          repoUrl: "https://github.com/SnapPython/my_database",
          source: "VPS Caddy + SSO",
          visibility: "private repo, SSO protected",
          status: "built",
          updated: "2026-07-10",
        },
        {
          name: "Voice Daily",
          repo: "voice-daily",
          description: "Voice Daily 网页应用。",
          url: "https://snappython.github.io/voice-daily/",
          repoUrl: "https://github.com/SnapPython/voice-daily",
          source: "main /",
          visibility: "private repo, public pages",
          status: "built",
          updated: "2026-06-06",
        },
      ];

      const grid = document.querySelector("#appGrid");
      const searchInput = document.querySelector("#searchInput");
      const emptyState = document.querySelector("#emptyState");
      const filters = Array.from(document.querySelectorAll(".filter"));
      const counts = {
        total: document.querySelector("#totalCount"),
        built: document.querySelector("#builtCount"),
        building: document.querySelector("#buildingCount"),
      };

      let activeFilter = "all";

      function statusLabel(status) {
        return status === "building" ? "构建中" : "已构建";
      }

      function initials(name) {
        return name
          .split(/[\s_-]+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part[0])
          .join("")
          .toUpperCase();
      }

      function renderCounts() {
        counts.total.textContent = APPS.length;
        counts.built.textContent = APPS.filter((app) => app.status === "built").length;
        counts.building.textContent = APPS.filter((app) => app.status === "building").length;
      }

      function matchesSearch(app, query) {
        if (!query) return true;
        const haystack = [
          app.name,
          app.repo,
          app.description,
          app.source,
          app.visibility,
          app.status,
        ]
          .join(" ")
          .toLowerCase();
        return haystack.includes(query);
      }

      function renderApps() {
        const query = searchInput.value.trim().toLowerCase();
        const visibleApps = APPS.filter((app) => {
          const statusMatch = activeFilter === "all" || app.status === activeFilter;
          return statusMatch && matchesSearch(app, query);
        });

        grid.innerHTML = visibleApps
          .map(
            (app) => `
              <article class="app-card">
                <div class="mark" aria-hidden="true">${initials(app.name)}</div>
                <div class="card-main">
                  <div class="card-head">
                    <h2 class="app-name">${app.name}</h2>
                    <span class="status ${app.status}">${statusLabel(app.status)}</span>
                  </div>
                  <p class="description">${app.description}</p>
                  <div class="meta">
                    <span class="pill">${app.repo}</span>
                    <span class="pill">${app.source}</span>
                    <span class="pill">${app.visibility}</span>
                    <span class="pill">${app.updated}</span>
                  </div>
                  <div class="actions">
                    <a class="action primary" href="${app.url}">打开应用</a>
                    <a class="action" href="${app.repoUrl}">查看仓库</a>
                  </div>
                </div>
              </article>
            `,
          )
          .join("");

        emptyState.style.display = visibleApps.length ? "none" : "block";
      }

      filters.forEach((button) => {
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;
          filters.forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
          renderApps();
        });
      });

      searchInput.addEventListener("input", renderApps);
      renderCounts();
      renderApps();
    </script>
  </body>
</html>
